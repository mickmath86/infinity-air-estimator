<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Infinity Air estimator: questionnaire preview</title>
  <style>
    body { margin: 0; padding: 48px 20px; background: #f4f7fa; }
  </style>
</head>
<body>
  <div id="infinity-air-estimator"></div>
  <!-- Same price-book estimator as the homepage. data-preview="true" shows options without sending a lead. -->
  <script src="./estimator-model.js"></script>
  <script src="./demo-flow.js"></script>
  <script
    src="./infinity-air-estimator.js"
    data-target="#infinity-air-estimator"
    data-pricebook-endpoint="/api/pricebook"
    data-preview="true"
    data-google-maps-key="YOUR_BROWSER_RESTRICTED_GOOGLE_MAPS_KEY"
    data-source="estimator-questionnaire-preview">
  </script>
</body>
</html>
